# Manual: applies VYBE's sign-in settings to the live Supabase project through the Management API.
# Run it from GitHub → Actions → "Apply sign-in settings" → Run workflow.
#   * Leaked-password protection (HaveIBeenPwned check) is switched on. Supabase offers it on the Pro plan and above; on
#     other plans the API refuses and the job says so.
#   * "Continue with Google" is switched on only when both repository secrets exist:
#       GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, from Google Cloud Console → APIs & Services → Credentials →
#       OAuth client ID (type "Web application"), with this authorised redirect URI:
#       https://ukgtcungmisthtmknxni.supabase.co/auth/v1/callback
#     The sign-in page shows the Google button by itself as soon as the provider is on.
# Uses the same SUPABASE_ACCESS_TOKEN secret as the other deploy workflows. Nothing else in the auth settings changes.
name: Apply sign-in settings
on:
  workflow_dispatch:
concurrency: { group: auth-settings, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      PROJECT_REF: ukgtcungmisthtmknxni
    steps:
      - name: Check the token
        run: if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is empty."; exit 1; fi
      - name: Leaked-password protection
        run: |
          code=$(curl -sS -o out.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data '{"password_hibp_enabled": true}')
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then echo "Leaked-password protection is on."
          else echo "::warning::Leaked-password protection was not switched on (HTTP $code): $(head -c 300 out.json). It needs the Pro plan."; fi
      - name: Continue with Google
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::notice::GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are not set; Google sign-in left as it is."; exit 0
          fi
          jq -n --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" \
            '{external_google_enabled: true, external_google_client_id: $id, external_google_secret: $secret}' > body.json
          code=$(curl -sS -o out.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @body.json)
          rm -f body.json
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::Google sign-in was not switched on (HTTP $code)."; exit 1; fi
          echo "Google sign-in is on."
