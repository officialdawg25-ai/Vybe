# Manual deploy of the Supabase Edge Functions (payments, live streaming, calls, maps, payouts, refunds).
# Run it from GitHub → Actions → "Deploy Edge Functions" → Run workflow.
# Needs ONE repository secret (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN   a personal access token from https://supabase.com/dashboard/account/tokens
# Function secrets (LiveKit, PayFast, Ozow, Google Maps…) are NOT set here; they live in Supabase → Edge Functions → Secrets.
name: Deploy Edge Functions
on:
  workflow_dispatch:
concurrency: { group: deploy-functions, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ukgtcungmisthtmknxni
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty. Create a token at https://supabase.com/dashboard/account/tokens and add it as a repository secret with that exact name."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy every function in supabase/functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
      - name: List what is live
        run: supabase functions list --project-ref "$PROJECT_REF"
