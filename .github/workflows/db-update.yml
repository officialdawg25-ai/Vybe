# Manual: applies the generated database updates (supabase/manual/update-NN/run-me.sql) to the live project, in order.
# Run it from GitHub → Actions → "Apply database update" → Run workflow, e.g. updates: "19 20 21".
# Uses the same SUPABASE_ACCESS_TOKEN secret as "Deploy Edge Functions" and the Supabase Management API's SQL endpoint.
# Each file is all-or-nothing, refuses to run before the update it depends on, and ends with a check table: the job fails
# unless every row says true. Only files generated into supabase/manual/update-NN/ can be run (no free-form SQL input).
name: Apply database update
on:
  workflow_dispatch:
    inputs:
      updates:
        description: Update numbers to apply, in order (e.g. "19 20 21")
        required: true
        default: '19 20 21'
concurrency: { group: db-update, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ukgtcungmisthtmknxni
      UPDATES: ${{ inputs.updates }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the token and the requested updates
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is empty."; exit 1; fi
          for n in $UPDATES; do
            [[ "$n" =~ ^[0-9]{2}$ ]] || { echo "::error::'$n' is not an update number"; exit 1; }
            [ -f "supabase/manual/update-$n/run-me.sql" ] || { echo "::error::supabase/manual/update-$n/run-me.sql does not exist"; exit 1; }
          done
      - name: Apply, in order, stopping at the first failure
        run: |
          set -euo pipefail
          for n in $UPDATES; do
            echo "::group::Update $n"
            jq -Rs '{query: .}' "supabase/manual/update-$n/run-me.sql" > body.json
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @body.json)
            cat out.json; echo
            echo "::endgroup::"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::Update $n failed (HTTP $code); it was rolled back."; exit 1; fi
            jq -e 'type == "array" and length > 0 and all(.[]; .ok == true)' out.json > /dev/null || { echo "::error::Update $n ran but a check is not true (see the table above)."; exit 1; }
            echo "Update $n applied; every check is true."
          done
